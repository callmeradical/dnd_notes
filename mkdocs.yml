site_name: DnD Notes
site_url: https://callmeradical.github.io/dnd_notes/ # Replace with your actual GitHub username
docs_dir: docs
theme:
  name: material
  palette:
    scheme: default
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/dnd-ampersand.png
  favicon: assets/dnd-ampersand.png
extra_javascript:
  - js/toc-filter.js
extra_css:
  - stylesheets/dnd-theme.css
  - css/toc-filter.css
markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
exclude_docs: |
  shuigari/CIVILIZATION_GAPS_SUMMARY.md
  shuigari/Currency and Trade Systems.md
  shuigari/Education and Literacy.md
  shuigari/Hideos-Steel-Tablet-Last-Will.md
  shuigari/Iron-Rest-Inn-Mama-Tora.md
  shuigari/Kaoru-Arrival-REVISED-Bargain.md
  shuigari/Kaoru-Starcall-Table-Scene.md
  shuigari/Legal System and Courts.md
  shuigari/Scientific and Technical Knowledge.md
  shuigari/Takashima City - Districts and Locations.md
  shuigari/The Hidden Petal Society.md
  shuigari/The Obsidian Circle - Organization.md
  shuigari/The Obsidian Circle 1.md
  shuigari/Tsurogami the Woven Tyrant.md
  shuigari/Writing Systems and Record-Keeping.md
  shuigari/Events/The Starcall Table.md
  shuigari/NPCs/Aiko Hayashi.md
  shuigari/NPCs/Daisuke Silver Pockets Inoue.md
  shuigari/NPCs/Haruki The Boar Takeda.md
  shuigari/NPCs/Kaoru Sugimoto.md
  shuigari/NPCs/Kazuya.md
  shuigari/NPCs/Tenka.md
  shuigari/NPCs/Twice Cursed Samurai.md
  shuigari/Organizations/Wild Lotus Society.md
  shuigari/PCs/Aoshi.md
  shuigari/PCs/Fox.md
  shuigari/PCs/Iseri Tetsuo.md
  shuigari/PCs/Kanji.md
  shuigari/PCs/Shigeo.md
  shuigari/PCs/Thornbringer.md
  shuigari/PCs/Yasei.md
  shuigari/_legacy/*
plugins:
  - search
  - tags
  - blog:
      blog_dir: .
      categories_name: Topics
  - macros:
      include_dir: .
