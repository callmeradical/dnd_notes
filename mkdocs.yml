site_name: DnD Notes
docs_dir: docs
theme:
  name: material
  palette:
    scheme: default
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/dnd-ampersand.png
  favicon: assets/dnd-ampersand.png
extra_css:
  - stylesheets/dnd-theme.css
markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
plugins:
  - search
  - tags
  - blog:
      blog_dir: .
      categories_name: Topics
  - macros:
      include_dir: .
nav:
  - Session Notes: index.md
  - Resources:
      - NPC Names: resources/npc_names.md
      - DM Screen: resources/dm_screen.md
      - Rules: resources/rules.md
      - Worldbuilding: resources/worldbuilding.md
      - Tools: resources/tools/index.md
      - Tips: resources/tips.md
  - Planning:
      - Templates: planning/templates/index.md
      - Future Campaigns: planning/future-campaigns/index.md
      - Utilities: planning/utilities/index.md
