site_name: DnD Notes
docs_dir: docs
theme:
  name: material
  palette:
    scheme: default
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/dnd-ampersand.png
  favicon: assets/dnd-ampersand.png
extra_css:
  - stylesheets/dnd-theme.css
plugins:
  - search
  - tags
nav:
  - Home: index.md
  - Campaigns:
    - Overview: campaigns/index.md
    - Archive:
      - Archive Overview: campaigns/archive/index.md
      - Bastion: campaigns/archive/bastion/index.md
      - Taldorei: campaigns/archive/taldorei/index.md
      - Tyranny of Dragons: campaigns/archive/tyranny-of-dragons/index.md
      - Session Archive: campaigns/archive/sessions/index.md
  - Resources:
    - Rules: resources/rules.md
    - Worldbuilding: resources/worldbuilding.md
    - DM Screen: resources/dm_screen.md
    - Tools: resources/tools/index.md
    - Tips: resources/tips.md
  - Planning:
    - Templates: planning/templates/index.md
    - Future Campaigns: planning/future-campaigns/index.md
    - Utilities: planning/utilities/index.md
  - Tags: tags.md
