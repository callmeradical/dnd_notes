site_name: D&D Notes
site_url: https://callmeradical.github.io/dnd_notes/ # Replace with your actual GitHub username
docs_dir: docs
theme:
  name: material
  palette:
    scheme: default
  features:
    - search.highlight
    - search.suggest
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/dnd-ampersand.png
  favicon: assets/dnd-ampersand.png
extra_javascript:
  - js/toc-filter.js
extra_css:
  - stylesheets/dnd-theme.css
  - css/toc-filter.css
markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
exclude_docs: shuigari/_legacy/*
plugins:
  - search
  - tags
  - blog:
      blog_dir: .
      categories_name: Topics
      post_excerpt_separator: "<!-- more -->"
  - macros:
      include_dir: .
      render_by_default: true
  - pagelist
nav:
  - Session Notes: index.md
  - Campaigns:
      - The Last Whisper of Steel:
          - Overview: campaigns/tlwos/index.md
          - Current State (Live - Middle Terrace): campaigns/tlwos/current-state.md
          - Canon Ledger: campaigns/tlwos/canon-ledger.md
          - Planning Workspace: campaigns/tlwos/planning/index.md
      - "Londra": campaigns/londra/index.md
      - "The Shadow in the Empire": campaigns/shadow-in-the-empire/index.md
  - Worldbuilding:
