site_name: DnD Notes
site_url: https://callmeradical.github.io/dnd_notes/ # Replace with your actual GitHub username
docs_dir: docs
theme:
  name: material
  palette:
    scheme: default
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/dnd-ampersand.png
  favicon: assets/dnd-ampersand.png
extra_javascript:
  - js/toc-filter.js
extra_css:
  - stylesheets/dnd-theme.css
  - css/toc-filter.css
markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
plugins:
  - search
  - tags
  - blog:
      blog_dir: .
      categories_name: Topics
  - macros:
      include_dir: .
nav:
  - Session Notes: index.md
  - Campaigns:
      - campaigns/index.md
      - Londra: campaigns/londra/index.md
      - The Last Whisper of Steel: campaigns/tlwos/index.md
      - The Shadow in the Empire: campaigns/shadow-in-the-empire/index.md
