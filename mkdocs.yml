site_name: DnD Notes
site_url: https://callmeradical.github.io/dnd_notes/ # Replace with your actual GitHub username
docs_dir: docs
theme:
  name: material
  palette:
    scheme: default
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/dnd-ampersand.png
  favicon: assets/dnd-ampersand.png
extra_javascript:
  - js/toc-filter.js
extra_css:
  - stylesheets/dnd-theme.css
  - css/toc-filter.css
markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
plugins:
  - search
  - tags:
      tags_file: tags.md
  - blog:
      blog_dir: .
      categories_name: Topics
  - macros:
      include_dir: .
nav:
  - Session Notes: index.md
  - Campaigns:
      - campaigns/index.md
      - Londra: campaigns/londra/index.md
      - The Last Whisper of Steel: campaigns/tlwos/index.md
      - The Shadow in the Empire: campaigns/shadow-in-the-empire/index.md
  - Tags: tags.md
  - Resources:
      - NPC Names: resources/npc_names.md
      - DM Screen: resources/dm_screen.md
      - Downtime: resources/downtime.md
      - Rules: resources/rules.md
      - Spells: resources/spells.md
      - Bastions: resources/bastions.md
      - Worldbuilding: resources/worldbuilding.md
      - Tools: resources/tools/index.md
      - Tips: resources/tips.md
  - Planning:
      - Templates: planning/templates/index.md
      - TLWOS Arc 2: planning/tlwos-arc-2/index.md
      - Utilities: planning/utilities/index.md
      - Future Campaigns: planning/future-campaigns/index.md
