_templates_suffix: .jinja

post_type:
  type: str
  help: "Type of post to create"
  choices:
    - session_prep
    - session_log
    - londra_session
    - downtime
    - general
  default: session_prep

campaign_prefix:
  type: str
  help: "Filename prefix for this campaign (e.g., 'tlw', 'lon', 'tsi')"

campaign_name:
  type: str
  help: "Campaign name (e.g., 'Bastion', 'Tyranny of Dragons')"
  when: "{{ post_type in ['session_prep', 'session_log'] }}"

session_number:
  type: str
  help: "Session number (numeric for session_prep/session_log, e.g., '19'; or '01' for Londra)"
  when: "{{ post_type in ['session_prep', 'session_log', 'londra_session'] }}"
  default: "01"

session_title:
  type: str
  help: "Session title or theme"
  when: "{{ post_type in ['session_prep', 'session_log'] }}"

arc:
  type: str
  help: "Arc title (e.g., 'Arc 2 - The Iron Court')"
  when: "{{ post_type == 'session_log' }}"

date_played:
  type: str
  help: "Date played (YYYY-MM-DD), leave blank if unknown"
  when: "{{ post_type == 'session_log' }}"
  default: ""

session_type:
  type: str
  help: "Type of Londra session"
  choices:
    - regular
    - downtime
    - special
  default: regular
  when: "{{ post_type == 'londra_session' }}"

include_overview:
  type: bool
  help: "Include Overview section (common for early sessions)"
  default: true
  when: "{{ post_type == 'londra_session' }}"

include_stars_wishes:
  type: bool
  help: "Include Stars and Wishes section (for feedback)"
  default: false
  when: "{{ post_type == 'londra_session' }}"

include_downtime:
  type: bool
  help: "Include Downtime section"
  default: true
  when: "{{ post_type in ['londra_session', 'downtime'] }}"

review_characters:
  type: str
  help: "Character review notes (motivations, unresolved threads, spotlight goals)"
  multiline: true
  default: ""
  when: "{{ post_type == 'session_prep' }}"

strong_start:
  type: str
  help: "Strong start (1-3 sentences)"
  multiline: true
  when: "{{ post_type == 'session_prep' }}"

possible_scenes:
  type: str
  help: "Possible scenes (bullets or short paragraphs)"
  multiline: true
  default: ""
  when: "{{ post_type == 'session_prep' }}"

fantastic_locations:
  type: str
  help: "Fantastic locations to feature"
  multiline: true
  default: ""
  when: "{{ post_type == 'session_prep' }}"

secrets_clues:
  type: str
  help: "Secrets and clues to reveal"
  multiline: true
  default: ""
  when: "{{ post_type == 'session_prep' }}"

important_npcs:
  type: str
  help: "Important NPCs (names + goals)"
  multiline: true
  default: ""
  when: "{{ post_type == 'session_prep' }}"

monsters:
  type: str
  help: "Monsters/opponents likely to appear"
  multiline: true
  default: ""
  when: "{{ post_type == 'session_prep' }}"

treasure:
  type: str
  help: "Treasure or rewards"
  multiline: true
  default: ""
  when: "{{ post_type == 'session_prep' }}"

title:
  type: str
  help: "Post title"
  default: >-
    {% if post_type == 'session_prep' %}
    Session {{ '%03d' | format(session_number | int) }}: {{ session_title }}
    {% elif post_type == 'session_log' %}
    Session {{ '%03d' | format(session_number | int) }}: {{ session_title }}
    {% elif post_type == 'londra_session' %}
    Londra: {{ session_number }}
    {% elif post_type == 'downtime' %}
    Downtime Notes
    {% else %}
    New Post
    {% endif %}

tags:
  type: str
  help: "Comma separated list of tags"
  default: >-
    {% if post_type == 'session_log' %}
    session-notes, session-log, {{ campaign_prefix | lower }}
    {% elif post_type == 'session_prep' %}
    session-notes, {{ campaign_prefix | lower }}
    {% elif post_type == 'londra_session' %}
    session-notes, {{ campaign_prefix | lower }}
    {% elif post_type == 'downtime' %}
    session-notes, downtime, {{ campaign_prefix | lower }}
    {% else %}
    {{ campaign_prefix | lower }}
    {% endif %}

summary:
  type: str
  help: "Short summary"
  default: >-
    {% if post_type == 'session_prep' %}
    Session {{ '%03d' | format(session_number | int) }} prep notes.
    {% else %}
    {{ '' }}
    {% endif %}

slug:
  type: str
  help: "File name slug (auto-generated from post info)"
  default: >-
    {% if post_type == 'session_prep' %}
    {{ campaign_prefix | lower }}-{{ '%03d' | format(session_number | int) }}-prep
    {% elif post_type == 'session_log' %}
    {{ campaign_prefix | lower }}-{{ '%03d' | format(session_number | int) }}-session
    {% elif post_type == 'londra_session' %}
    {{ campaign_prefix | lower }}-{{ session_number | lower }}
    {% elif post_type == 'downtime' %}
    {{ campaign_prefix | lower }}-downtime
    {% else %}
    {{ campaign_prefix | lower }}-post
    {% endif %}

_envops:
  block_start_string: "{%"
  block_end_string: "%}"
  variable_start_string: "{{"
  variable_end_string: "}}"
